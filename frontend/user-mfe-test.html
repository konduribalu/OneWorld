<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User MFE Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-section {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 { color: #1976d2; }
        h2 { color: #333; margin-top: 0; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 4px; overflow-x: auto; }
        button { 
            background: #1976d2; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 4px; 
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #1565c0; }
        #loginContainer { min-height: 400px; }
    </style>
</head>
<body>
    <h1>User MFE Test Page</h1>
    
    <div class="test-section">
        <h2>Step 1: Check if user-mfe is running</h2>
        <button onclick="checkService()">Check Service</button>
        <div id="serviceStatus"></div>
    </div>

    <div class="test-section">
        <h2>Step 2: Load Scripts</h2>
        <button onclick="loadScripts()">Load Scripts</button>
        <div id="scriptStatus"></div>
    </div>

    <div class="test-section">
        <h2>Step 3: Check API Methods</h2>
        <button onclick="checkAPI()">Check API</button>
        <div id="apiStatus"></div>
    </div>

    <div class="test-section">
        <h2>Step 4: Test Login Mount</h2>
        <button onclick="mountLogin()">Mount Login</button>
        <button onclick="unmountLogin()">Unmount</button>
        <div id="loginContainer"></div>
    </div>

    <script>
        let unmountFn = null;

        async function checkService() {
            const status = document.getElementById('serviceStatus');
            status.innerHTML = '<div class="status warning">Checking...</div>';
            
            try {
                const response = await fetch('http://localhost:4301/');
                if (response.ok) {
                    status.innerHTML = '<div class="status success">✅ Service is running on port 4301</div>';
                } else {
                    status.innerHTML = `<div class="status error">❌ Service responded with status: ${response.status}</div>`;
                }
            } catch (error) {
                status.innerHTML = `<div class="status error">❌ Cannot connect to service on port 4301<br><br><strong>Fix:</strong><br>1. Open a new terminal<br>2. cd E:\\Microservices\\OneWorld\\frontend\\user-mfe<br>3. npm start</div>`;
            }
        }

        async function loadScripts() {
            const status = document.getElementById('scriptStatus');
            status.innerHTML = '<div class="status warning">Loading scripts...</div>';
            
            try {
                // Load remoteEntry.js
                await loadScript('http://localhost:4301/remoteEntry.js');
                status.innerHTML = '<div class="status success">✅ remoteEntry.js loaded</div>';
                
                // Load bundle.js
                try {
                    await loadScript('http://localhost:4301/bundle.js');
                    status.innerHTML += '<div class="status success">✅ bundle.js loaded</div>';
                } catch (e) {
                    status.innerHTML += '<div class="status warning">⚠️ bundle.js not found (might not be needed)</div>';
                }

                // Wait for API to initialize
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                if (window.userMfe) {
                    status.innerHTML += '<div class="status success">✅ window.userMfe API is available</div>';
                } else {
                    status.innerHTML += '<div class="status error">❌ window.userMfe is not available after loading scripts</div>';
                }
            } catch (error) {
                status.innerHTML = `<div class="status error">❌ Failed to load scripts: ${error.message}</div>`;
            }
        }

        function loadScript(url) {
            return new Promise((resolve, reject) => {
                if (document.querySelector(`script[src="${url}"]`)) {
                    resolve();
                    return;
                }
                const script = document.createElement('script');
                script.src = url;
                script.onload = resolve;
                script.onerror = () => reject(new Error(`Failed to load ${url}`));
                document.head.appendChild(script);
            });
        }

        function checkAPI() {
            const status = document.getElementById('apiStatus');
            
            if (!window.userMfe) {
                status.innerHTML = '<div class="status error">❌ window.userMfe is not defined<br><br>Load scripts first (Step 2)</div>';
                return;
            }

            const expectedMethods = [
                'mountLogin',
                'mountRegister',
                'mountProfile',
                'mountAvatar',
                'mountIcon',
                'isLoggedIn',
                'getCurrentUser',
                'logout'
            ];

            let html = '<div class="status success">✅ window.userMfe exists</div>';
            html += '<h3>Available Methods:</h3><pre>';
            
            const availableMethods = Object.keys(window.userMfe);
            html += JSON.stringify(availableMethods, null, 2);
            html += '</pre>';

            html += '<h3>Method Check:</h3>';
            expectedMethods.forEach(method => {
                const exists = typeof window.userMfe[method] === 'function';
                const icon = exists ? '✅' : '❌';
                const className = exists ? 'success' : 'error';
                html += `<div class="status ${className}">${icon} ${method}: ${typeof window.userMfe[method]}</div>`;
            });

            status.innerHTML = html;
        }

        async function mountLogin() {
            const container = document.getElementById('loginContainer');
            
            if (!window.userMfe) {
                container.innerHTML = '<div class="status error">❌ window.userMfe not available. Load scripts first.</div>';
                return;
            }

            if (typeof window.userMfe.mountLogin !== 'function') {
                container.innerHTML = '<div class="status error">❌ window.userMfe.mountLogin is not a function</div>';
                return;
            }

            try {
                container.innerHTML = '<div class="status warning">Mounting login component...</div>';
                
                unmountFn = await window.userMfe.mountLogin(container, {
                    onLogin: (user) => {
                        alert('Login successful: ' + JSON.stringify(user));
                    },
                    onRegisterClick: () => {
                        alert('Register clicked');
                    }
                });

                console.log('Login mounted successfully!');
            } catch (error) {
                container.innerHTML = `<div class="status error">❌ Failed to mount login: ${error.message}</div>`;
                console.error('Mount error:', error);
            }
        }

        function unmountLogin() {
            if (unmountFn) {
                unmountFn();
                unmountFn = null;
                document.getElementById('loginContainer').innerHTML = '<div class="status success">✅ Login unmounted</div>';
            } else {
                document.getElementById('loginContainer').innerHTML = '<div class="status warning">⚠️ Nothing to unmount</div>';
            }
        }

        // Auto-check on load
        window.addEventListener('load', () => {
            checkService();
        });
    </script>
</body>
</html>
