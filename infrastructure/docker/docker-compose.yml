services:
  postgres:
    image: postgres:15
    container_name: oneworld-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: oneworld_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:6
    container_name: oneworld-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    container_name: oneworld-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  zookeeper:
    image: zookeeper:3.9.4
    container_name: oneworld-zookeeper
    restart: unless-stopped
    environment:
      ALLOW_ANONYMOUS_LOGIN: yes
    ports:
      - "2181:2181"

  kafka:
    image: bitnami/kafka:3
    container_name: oneworld-kafka
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      ALLOW_PLAINTEXT_LISTENER: yes
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper

  minio:
    image: minio/minio:latest
    container_name: oneworld-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  prometheus:
    image: prom/prometheus:latest
    container_name: oneworld-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: oneworld-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  auth-service:
    build:
      context: ../../backend/auth-service
      dockerfile: Dockerfile
    container_name: oneworld-auth-service
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: oneworld_db
      DB_USER: admin
      DB_PASSWORD: admin123
      JWT_SECRET: your-secret-key-change-in-production
      JWT_EXPIRY: 24h
    ports:
      - "3001:3001"
    depends_on:
      - postgres

  comment-service:
    build:
      context: ../../backend/comment-service
      dockerfile: Dockerfile
    container_name: oneworld-comment-service
    restart: unless-stopped
    environment:
      PORT: 3002
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: oneworld_db
      DB_USER: admin
      DB_PASSWORD: admin123
      JWT_SECRET: your-secret-key-change-in-production
    ports:
      - "3002:3002"
    depends_on:
      - postgres
      - auth-service

volumes:
  postgres_data:
  mongo_data:
  minio_data:
  prometheus_data:
